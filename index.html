function settings(){return `<section class="settings no-print" id="ai-settings"><div class="section-title"><h2>✦ Gemini AI 工作台</h2><span class="badge">${keyChecked?'已驗證連線':'請設定 API Key'}</span></div><p class="help">使用你自己的 Gemini API 額度辨識教材、學習考法與產生仿卷。金鑰只留在當次分頁記憶體，不寫入帳號或瀏覽器儲存。</p><div class="settings-grid"><div><form id="key-form"><div class="field"><label for="gemini-key">Gemini API Key</label><div class="key-controls"><input id="gemini-key" type="password" autocomplete="off" placeholder="貼上從 Google AI Studio 取得的 API Key" value="${esc(geminiKey)}"><button class="btn primary" id="test-key" type="submit">測試連線</button><button type="button" class="btn" data-action="clear-key">清除</button></div></div><div class="field"><label for="gemini-model">使用模型</label>${models.length?`<select id="gemini-model">${models.map(m=>`<option value="${esc(m.id)}" ${model===m.id?'selected':''}>${esc(m.name||m.id)} · ${esc(m.id)}</option>`).join('')}</select>`:`<input id="gemini-model" value="${esc(model)}" placeholder="先測試連線取得可用模型">`}</div><div id="key-result" class="status-line" role="status"></div></form><p class="help">按下 AI 辨識／出卷時，所選檔案與教材會由你的瀏覽器直接傳送到 Google Gemini，回傳內容再由本站檢查；依你的 Google 專案配額與方案計費。請先遮住學生姓名等不必要資訊。</p></div><div><h3>如何取得 Gemini API Key？</h3><ol class="setup-steps"><li>前往 <a class="guide-link" href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener">Google AI Studio → API Keys</a>，登入 Google 帳號。</li><li>選擇「Create API key／建立 API 金鑰」，選取或建立專案；依畫面完成必要設定。</li><li>複製金鑰，貼到左方欄位，按「測試連線」。</li><li>選擇帳號實際可用的 Gemini 模型。確認額度後即可辨識與出卷。</li></ol><p class="help">Gemini API Key 只用於教材辨識與出卷，與 Email 登入密碼無關。<a href="https://ai.google.dev/gemini-api/docs/api-key" target="_blank" rel="noopener">Google 官方金鑰說明</a> · <button class="text-btn" data-go="guide">查看完整教學 →</button></p></div></div></section>`}
function home(){return `${heading('YOUR NOTES. YOUR NEXT CHAPTER.','考試有範圍，練習有方向。','把自己的教材和學校考法，變成專屬的仿真練習卷。',`<button class="btn primary" data-go="generate">${icon('pen')}開始出卷</button>`)}${!user?`<div class="onboard"><h2>先建立你的雲端學習空間</h2><p>登入後，教材與考卷就能跨裝置保存。第一次進來是一張白紙，由你決定從哪一課開始。</p><button class="btn primary" data-go="account">登入／註冊帳號</button></div>`:''}<div class="quick-steps">${[['1','登記考試範圍','一次上傳多張單字表、課本或手寫筆記。AI 拆成卡片，再由你確認。','建立範圍資料夾','new-folder'],['2','讓 AI 看懂學校考法','上傳完整考卷頁面，分析題型、比例、配分與出題特徵。','上傳考卷學習樣式','style-upload'],['3','用熟悉的考法練習','選範圍與樣式，AI 產生全新仿卷，線上作答或列印。','建立仿真考卷','generate']].map(([n,t,d,l,a])=>`<section class="quick-step"><span class="step-dot">${n}</span><h3>${t}</h3><p>${d}</p><button class="btn small ${n==='1'?'primary':''}" ${a==='generate'?'data-go':'data-action'}="${a}">${l} →</button></section>`).join('')}</div><div class="stats">${[['folder',db.folders.length,'個','範圍資料夾'],['book',totalCards(),'張','已確認的教材卡片'],['pen',db.exams.length,'份','專屬練習卷']].map(([i,n,u,t])=>`<div class="stat"><div class="stat-icon">${icon(i)}</div><div><b>${n}</b><small>${u}</small><p>${t}</p></div></div>`).join('')}</div><div class="section-title"><h2>我的考試範圍</h2><button class="text-btn" data-go="folders">查看全部 →</button></div><div class="folder-grid">${db.folders.length?db.folders.slice(0,3).map(folderCard).join(''):emptyFolders()}</div>`}
function emptyFolders(){return `<div class="empty large">${icon('folder')}<h2>從你的第一個範圍開始</h2><p>這裡沒有預載教材。建立資料夾、取個名字，再上傳你的單字表或筆記。</p><button class="btn primary" data-action="new-folder">＋ 建立資料夾</button></div>`}
function folderCard(f){return `<button class="folder" data-folder="${esc(f.id)}"><div class="folder-top"><span class="folder-symbol"></span><span class="subject">${esc(f.subject||'教材')}</span></div><h3>${esc(f.name)}</h3><div class="desc">${esc(f.desc||'自己的教材，自己的學習範圍。')}</div><div class="folder-foot"><span>${f.cards.length} 張卡片 · ${f.sources?.length||0} 個檔案</span><span>管理範圍 ↗</span></div></button>`}
function folders(){return `${heading('YOUR LEARNING LIBRARY','我的考試範圍','可一次上傳多個教材檔案；辨識後先校對，再登記成正式範圍。',button('＋ 新增資料夾','new-folder',true))}<div class="toolbar"><input type="search" id="folder-search" placeholder="搜尋資料夾名稱…" aria-label="搜尋資料夾">${button(icon('camera')+'多檔上傳教材','materials-upload')}${button('匯出備份','export')}<label class="btn">匯入備份<input type="file" id="import-backup" accept="application/json" hidden></label></div><div class="folder-grid" id="folder-results">${db.folders.length?db.folders.map(folderCard).join(''):emptyFolders()}</div>`}
function detail(){const f=folder();if(!f)return folders();return `${heading('REVIEWED. READY TO LEARN.',esc(f.name),`${esc(f.subject||'教材')} · ${f.cards.length} 張已確認卡片`,button(icon('camera')+'多檔上傳教材','materials-upload',true))}<div class="toolbar"><button class="btn small" data-go="folders">← 所有範圍</button>${button('新增卡片','add-card')}${button('重新命名','rename')}${button('刪除資料夾','delete-folder')}</div><div class="source-links">${(f.sources||[]).map(s=>`<a href="/api/files/${esc(s.id)}" target="_blank" rel="noopener">${icon('file')}${esc(s.name)} ↗</a>`).join('')}</div><div class="cards">${f.cards.length?f.cards.map(c=>`<article class="card ${c.kind==='note'?'note':''}"><button class="delete" data-edit-card="${esc(c.id)}" aria-label="編輯 ${esc(c.word)}">✎</button><div class="eyebrow">${c.kind==='note'?'NOTE / CONCEPT':'VOCABULARY'}</div><div class="word">${esc(c.word)}</div><div class="meaning">${esc(c.meaning)}</div>${c.example?`<div class="example">${esc(c.example)}</div>`:''}<div class="help" style="margin-top:12px">${esc(c.sourceName||'手動登記')}</div></article>`).join(''):'<div class="empty"><h2>準備好教材了嗎？</h2><p>多張照片、PDF 或文字檔都能一起上傳，讓 Gemini 幫你整理。</p><button class="btn primary" data-action="materials-upload">上傳教材並辨識</button></div>'}</div>`}
function templates(){return `${heading('LEARN THE WAY YOUR SCHOOL ASKS','AI 考卷樣式','讓 AI 讀完整份考卷，學習題型、配比、難度與出法。',button('＋ 上傳考卷分析','style-upload',true))}<div class="notice">這裡的「學習」是分析並儲存出題結構，之後以此引導 Gemini 生成仿卷；不會訓練或改動你的 Gemini 基礎模型。</div><div class="folder-grid">${db.templates.length?db.templates.map(t=>`<article class="panel"><div class="folder-top"><span class="doc-icon">${icon('file')}</span><span class="badge">AI 已分析・人工已確認</span></div><h3>${esc(t.name)}</h3><p class="help">${esc(t.summary||'')}</p>${t.sections.map(s=>`<div class="number-row help"><span>${esc(s.name)}</span><span>${s.count} 題 × ${s.points} 分</span></div>`).join('')}<p class="help">共 ${t.sections.reduce((n,s)=>n+s.count,0)} 題 · ${t.minutes||30} 分鐘</p><div class="toolbar" style="margin-top:20px;margin-bottom:0"><button class="btn primary small" data-template-use="${esc(t.id)}">用這個樣式</button><button class="btn small" data-edit-template="${esc(t.id)}">檢視／編輯</button></div></article>`).join(''):'<div class="empty large"><h2>先讓 AI 看一份學校考卷</h2><p>一次上傳同一份考卷的所有頁面，AI 會整理各大題的出法；你可以校對後再儲存。</p><button class="btn primary" data-action="style-upload">上傳考卷照片或 PDF</button></div>'}</div>`}
function generate(){return `${heading('SAME FORMAT. A NEW CHALLENGE.','建立仿真考卷','用自己的範圍，練習學校熟悉的出法。')}<form id="generate-form"><div class="form-grid"><section class="panel"><div class="section-title"><h2>01 選擇已確認範圍</h2><span class="badge">可複選</span></div>${db.folders.length?db.folders.map(f=>`<label class="checkbox-row"><input type="checkbox" name="scope" value="${esc(f.id)}" ${f.cards.length?'checked':'disabled'}><span>${esc(f.name)}<small class="help" style="display:block">${f.cards.length} 張卡片</small></span></label>`).join(''):'<p class="help">尚未建立範圍。請先新增資料夾並上傳教材。</p>'}<p class="help">只有經你確認儲存的卡片會成為出題範圍。AI 產生的考點會檢查卡片來源；自然語言內容仍應在正式使用前核對。</p></section><section class="panel"><h2>02 選擇 AI 分析過的樣式</h2><div class="field"><label for="template-select">考卷樣式</label><select id="template-select" required>${db.templates.length?db.templates.map(t=>`<option value="${esc(t.id)}" ${preferredTemplate===t.id?'selected':''}>${esc(t.name)}</option>`).join(''):'<option value="">尚無樣式，請先上傳考卷分析</option>'}</select></div><div id="template-summary"></div><div class="field"><label for="exam-name">新考卷名稱</label><input id="exam-name" required maxlength="80" value="我的仿真練習卷"></div><p class="help">會把選定卡片與考卷出題結構傳給 Google Gemini。每次最多 60 題；建議先產生較短的練習卷確認效果。</p><button class="btn primary" id="generate-button" type="submit" style="width:100%">✦ Gemini 產生仿真卷</button><div id="generate-status" class="status-line" role="status"></div></section></div></form>`}
function history(){return `${heading('EVERY PRACTICE COUNTS','練習紀錄','考卷與作答都跟著帳號走；換裝置也能繼續。')}<section class="panel">${db.exams.length?db.exams.map(e=>`<button class="template-row" style="width:100%;text-align:left" data-exam="${esc(e.id)}"><span class="doc-icon">${icon(e.submitted?'check':'file')}</span><div><strong>${esc(e.title)}</strong><p>${esc(new Date(e.created).toLocaleDateString('zh-TW'))} · ${e.questions.length} 題 · ${e.submitted?'已完成':'可繼續作答'}</p></div><span class="arrow">${e.submitted?e.score+' 分':'繼續 →'}</span></button>`).join(''):'<div class="empty"><h2>從第一份仿真卷開始</h2><p>選範圍和考卷樣式，就能開始練習。</p><button class="btn primary" data-go="generate">建立仿真考卷</button></div>'}</section>`}
function normalize(a){return String(a||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?。！？]$/,'').replace(/\s+/g,' ')}
function examView(){const e=exam();if(!e)return history();return `<div class="exam"><div class="toolbar no-print"><button class="btn small" data-go="history">← 練習紀錄</button>${button('列印空白卷／PDF','print')}${button('列印詳細解答','print-answers')}</div><div class="panel"><div class="exam-head"><div class="eyebrow">STUDYFORM · AI PRACTICE PAPER</div><h1>${esc(e.title)}</h1><p class="help">${e.questions.length} 題 · ${e.minutes} 分鐘 · 滿分 ${e.totalPoints}<br>${esc(e.scope)}</p><div class="print-only">姓名：________________　日期：________________</div>${e.submitted?`<div class="score no-print">${e.score}<small style="font-size:15px"> / 100</small></div><p class="help no-print">${e.gradingMethod==='ai'?'Gemini 輔助批改，請對照解答確認。':'依參考答案比對；開放題可在下方自行評分。'}</p>`:''}</div><form id="answer-form">${e.questions.map((q,i)=>`${i===0||e.questions[i-1].sectionIndex!==q.sectionIndex?`<div class="section-heading"><h2>${esc(e.sections[q.sectionIndex]?.name||typeNames[q.type])}</h2><p>${esc(e.sections[q.sectionIndex]?.instruction||'')} · 每題 ${q.points} 分</p></div>`:''}<div class="question">${q.context?`<div class="passage">${esc(q.context)}</div>`:''}<h3>${i+1}. ${esc(q.prompt)}</h3>${q.options?.length?`<div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${esc(o)}" ${e.answers?.[i]===o?'checked':''} ${e.submitted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`:`<textarea name="q${i}" aria-label="第 ${i+1} 題答案" placeholder="輸入你的答案" ${e.submitted?'readonly':''}>${esc(e.answers?.[i]||'')}</textarea>`}<div class="exam-sources no-print">範圍依據：${esc((q.sourceLabels||[]).join('、'))}</div><div class="answer ${e.submitted&&e.grades?.[i]?.credit<1?'wrong':''}" ${!e.submitted?'hidden':''}>${e.submitted?`<span class="no-print">${e.grades?.[i]?.credit===1?'✓ 答對了':'需複習／核對'} · 本題 ${Math.round((e.grades?.[i]?.credit||0)*q.points*100)/100} / ${q.points} 分<br>${esc(e.grades?.[i]?.feedback||'')}<br></span>`:''}<strong>參考答案：${esc(q.answer)}</strong>${q.acceptedAnswers?.length?`<br>可接受答案：${esc(q.acceptedAnswers.join('；'))}`:''}<br>${esc(q.explanation)}${e.submitted&&['rewrite','short','cloze'].includes(q.type)?`<label class="number-row no-print">核對後自行評分（0–${q.points}）<input type="number" step="0.5" min="0" max="${q.points}" data-self-grade="${i}" value="${Math.round((e.grades?.[i]?.credit||0)*q.points*100)/100}"></label>`:''}</div></div>`).join('')}${!e.submitted?`<div class="toolbar no-print" style="margin-top:22px"><button class="btn primary" id="submit-ai" type="submit">✦ Gemini 批改並交卷</button><button class="btn" type="button" data-action="local-grade">依參考答案交卷</button></div><p class="help no-print">AI 批改接受正確的替代句型；參考答案批改以文字比對，開放題請自行核對。</p><div id="grade-status" class="status-line no-print" role="status"></div>`:''}</form></div></div>`}
function accountUnavailable(){return heading('ACCOUNT CONNECTION','帳號與登入','登入需要後台服務；靜態 HTML 或 GitHub Pages 預覽無法建立真正的帳號。')+'<section class="panel"><h2>目前尚未連接登入後台</h2><p class="help">若是在這台電腦測試，請在 ZIP 解壓後執行 npm run preview:local，再開啟 http://127.0.0.1:4180/ 。若要跨裝置使用，請依 SETUP.md 部署到 Cloudflare。</p><button class="btn primary" data-action="reconnect">重新檢查後台</button></section>'}

function guide(){return `${heading('START HERE. LEARN YOUR WAY.','完整使用說明','從帳號、API 設定，到校對、仿卷與跨裝置同步，一次學會。')}<div class="guide"><section class="panel"><h2>① 登入你的雲端學習空間</h2><ol><li>開啟右上角「帳號」，可使用 Email 註冊／登入。</li><li>註冊時輸入顯示名稱、Email 與至少10字元密碼。登入同一帳號，即可載回原資料。</li><li>首次使用沒有預設資料夾。請使用原本註冊的 Email 與密碼登入。</li></ol><p>切換帳號或裝置前請確認右上角顯示「已同步至雲端」。請確認右上角顯示已同步，再切換裝置。</p><button class="btn small" data-go="account">前往帳號頁</button></section><section class="panel"><h2>② 取得並設定 Gemini API Key</h2><ol><li>前往 <a class="guide-link" href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener">Google AI Studio 的 API Keys 頁</a>，登入 Google。</li><li>點 Create API key，依畫面選取／建立專案及完成必要設定。若沒有建立權限，請確認 Google 帳號、地區與專案權限。</li><li>複製 API Key，貼到每個頁面下方的「Gemini AI 工作台」。</li><li>按「測試連線」，系統會從 Gemini API 取得這把金鑰可用的模型，選擇其中一個。連線測試不產生考卷。</li><li>辨識與出卷會使用此專案的 API 額度；是否需付費與限額以 Google AI Studio 顯示為準。</li></ol><p>金鑰只留在這次開啟的分頁記憶體，重新整理、登出或換裝置後要重新輸入。<a class="guide-link" href="https://ai.google.dev/gemini-api/docs/api-key" target="_blank" rel="noopener">官方金鑰說明</a></p></section><section class="panel"><h2>③ 多檔上傳教材，建立考試範圍</h2><ol><li>進入「考試範圍」→「新增資料夾」，自行輸入如「英文第3課」與科目。</li><li>開啟資料夾，按「多檔上傳教材」。可一次複選檔案，也能重複加選或拍照加入。</li><li>支援 JPG、PNG、WebP、PDF、TXT、MD；每批最多10檔，每檔8MB，合計傳送大小約12MB。HEIC 請先轉 JPG。</li><li>拍攝時讓文字清晰、光線平均，筆記盡量平放；同一份內容請依頁碼順序加入。PDF 可含多頁。</li><li>按「Gemini 辨識全部檔案」。所選內容將傳至 Google Gemini 分析，可能需要一段時間。</li><li>逐張校對 AI 抽出的單字或概念卡。黃色卡片代表文字不確定，務必修正；不需要的卡片可取消勾選。</li><li>按「確認並存入範圍」，卡片與原檔會存到目前帳號。跨裝置可下載原檔、查看卡片。</li></ol><p>AI 不會自動將尚未校對的內容加入出題範圍。原檔可能包含姓名等個資，上傳前請先遮蔽不必要資訊。</p></section><section class="panel"><h2>④ 上傳學校考卷，讓 AI 學習出法</h2><ol><li>進入「考卷樣式」→「上傳考卷分析」，加入同一份考卷的所有頁面。</li><li>按「分析考卷出法」，AI 會辨識大題、選擇／克漏字／句型改寫／簡答／閱讀題、題數、配分及難度。</li><li>查看 AI 摘要與辨識警告，對照照片，逐項確認大題名稱、每題分數、題數、指示與代表題。</li><li>可新增／刪除大題或調整數字。確認後命名並儲存樣式，之後可重複使用。</li></ol><p>這是分析樣式並在出題時提供範例，並非重新訓練 Gemini 模型。照片模糊或缺頁會影響結果，請先修正再保存。</p></section><section class="panel"><h2>⑤ 產生仿真考卷、作答與解答</h2><ol><li>進入「仿真出卷」，勾選一個或多個範圍、選擇已確認的考卷樣式，輸入新卷名稱。</li><li>按「Gemini 產生仿真卷」。系統會送出已確認卡片與樣式，模仿考法產生新情境；每次最多60題。</li><li>系統檢查題型題數、選項答案與教材來源。不符合結構會要求重試；自然語言的範圍正確性仍需要人工確認。</li><li>在線上作答，答案會持續存到雲端。右上角顯示已同步後可關閉，之後從「練習紀錄」繼續。</li><li>交卷可選 Gemini 輔助批改，或依參考答案文字比對。開放題可對照詳細解答自行調整本題分數。</li><li>要紙本作答，按「列印空白卷／PDF」；列印時不會帶入填過的答案。需要答案本，按「列印詳細解答」。</li></ol><p>AI 有可能辨識或出題錯誤，正式使用前請核對範圍、題幹、答案與解說。</p></section><section class="panel"><h2>⑥ 同步、備份與常見問題</h2><ul><li><strong>換裝置：</strong>開同一網址、登入同一種帳號，教材與紀錄會載回；API Key 需重新貼上。</li><li><strong>同步失敗：</strong>保留頁面、先匯出備份，再重試同步。若其他裝置已更新，匯出後載入雲端並匯入備份合併，避免覆寫。</li><li><strong>API Key 無效：</strong>確認貼上完整、專案允許 Gemini API，再按測試連線。</li><li><strong>429／配額不足：</strong>到 AI Studio 檢查額度、計費或速率限制，稍後重試。</li><li><strong>辨識不全：</strong>重新拍清楚、補齊缺頁或減少每批檔案；不要直接保存錯字。</li><li><strong>仿卷產生失敗：</strong>檢查樣式題數，減少題數／範圍或換可用模型。</li><li><strong>舊資料：</strong>帳號頁的「匯入舊版瀏覽器資料」僅匯入你曾自行新增的內容，會排除舊版內建示範資料。</li><li><strong>刪除資料夾：</strong>刪除卡片與資料夾，已生成考卷保留；原檔仍保留在帳號儲存供既有引用使用。</li><li><strong>加到手機主畫面：</strong>Safari 分享選單／Chrome 選單選「加入主畫面」。仍需要網路連線。</li></ul><p>相關官方文件：<a class="guide-link" href="https://ai.google.dev/gemini-api/docs/image-understanding" target="_blank" rel="noopener">Gemini 圖像理解</a></p></section></div>`}
function closeModal(){modalRun++;$('#modal').close();files.forEach(f=>f.preview&&URL.revokeObjectURL(f.preview));files=[];review=null}
function modal(html,wide=false){files.forEach(f=>f.preview&&URL.revokeObjectURL(f.preview));files=[];review=null;modalRun++;$('#modal').className=wide?'modal-wide':'';$('#modal').innerHTML=html;$('#modal').showModal();$('#modal').querySelector('[data-close]')?.addEventListener('click',closeModal)}
function dialogTop(t){return `<div class="dialog-top"><h2>${t}</h2><button type="button" data-close aria-label="關閉">✕</button></div>`}
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
function needUser(){if(!user||!ready){go('account');toast('請先登入並連接雲端');return false}if(syncError){toast('請先處理同步失敗，避免新增資料遺失。');return false}return true}

function busy(node,text){if(!node)return()=>{};node.disabled=true;node.dataset.original=node.innerHTML;node.innerHTML='<span class="progress"></span>'+text;return()=>{node.disabled=false;node.innerHTML=node.dataset.original}}
function status(node,text,error=false){if(node){node.textContent=text;node.className='status-line'+(error?' error':'')}}
function newFolder(){if(!needUser())return;modal(`${dialogTop('建立你的考試範圍')}<form id="folder-form"><div class="field"><label>資料夾名稱<input name="name" required maxlength="70" placeholder="例如：英文第3課"></label></div><div class="field"><label>科目<input name="subject" required maxlength="30" placeholder="例如：英文"></label></div><div class="field"><label>備註<input name="desc" maxlength="150" placeholder="這次考試要準備哪些內容？"></label></div><div class="dialog-actions"><button class="btn primary">建立資料夾</button></div></form>`);$('#folder-form').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);if(!d.get('name').trim()||!d.get('subject').trim())return;const f={id:uid(),name:d.get('name').trim(),subject:d.get('subject').trim(),desc:d.get('desc').trim(),cards:[],sources:[]};db.folders.push(f);folderId=f.id;await commit();closeModal();go('detail')}}
function cardModal(c){if(!needUser())return;modal(`${dialogTop(c?'編輯教材卡片':'手動新增教材卡片')}<form id="card-form"><div class="field"><label>卡片類型<select name="kind"><option value="vocabulary">英文單字</option><option value="note" ${c?.kind==='note'?'selected':''}>概念／句型／筆記</option></select></label></div><div class="field"><label>單字或概念名稱<input name="word" required maxlength="300" value="${esc(c?.word||'')}"></label></div><div class="field"><label>中文意思／筆記內容<textarea name="meaning" required maxlength="5000">${esc(c?.meaning||'')}</textarea></label></div><div class="field"><label>教材例句（可留空）<textarea name="example" maxlength="5000">${esc(c?.example||'')}</textarea></label></div><div class="dialog-actions">${c?'<button type="button" id="remove-card" class="btn">刪除卡片</button>':''}<button class="btn primary">儲存卡片</button></div></form>`);$('#card-form').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);if(!d.get('word').trim()||!d.get('meaning').trim())return;const value={id:c?.id||uid(),kind:d.get('kind'),word:d.get('word').trim(),meaning:d.get('meaning').trim(),example:d.get('example').trim(),sourceName:c?.sourceName||'手動登記'};if(c)Object.assign(c,value);else folder().cards.push(value);await commit();closeModal();render()};if(c)$('#remove-card').onclick=async()=>{folder().cards=folder().cards.filter(x=>x.id!==c.id);await commit();closeModal();render()}}
const filePicker=()=>`<div class="upload">${icon('camera')} 多個檔案一起加入<div class="help">最多10檔・每檔8MB・JPG / PNG / WebP / PDF / TXT / MD</div><div class="multi-upload"><label class="btn small">選擇多個檔案<input type="file" id="multi-files" multiple accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,.txt,.md" hidden></label><label class="btn small">拍照加入<input type="file" id="camera-file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden></label></div></div><div class="file-list" id="file-list"></div>`;
function bindFiles(){const add=async e=>{const incoming=[...e.target.files];for(const file of incoming){if(files.length>=10){toast('每批最多10個檔案');break}const mime=file.type||(/\.md$/i.test(file.name)?'text/markdown':/\.txt$/i.test(file.name)?'text/plain':'');if(!['image/jpeg','image/png','image/webp','application/pdf','text/plain','text/markdown'].includes(mime)){toast(`${file.name}：格式不支援，HEIC 請轉為 JPG。`);continue}if(file.size>8*1024*1024){toast(`${file.name} 超過8MB，請縮小後再加入。`);continue}if(files.some(f=>f.file.name===file.name&&f.file.size===file.size)){toast('已略過重複檔案：'+file.name);continue}files.push({id:uid(),file,mime,preview:mime.startsWith('image/')?URL.createObjectURL(file):null})}e.target.value='';renderFiles()};$('#multi-files').onchange=add;$('#camera-file').onchange=add}
function renderFiles(){if(!$('#file-list'))return;$('#file-list').innerHTML=files.map((f,i)=>`<div class="file-row">${f.preview?`<img src="${esc(f.preview)}" alt="教材第${i+1}檔預覽">`:icon('file')}<span class="file-name">${i+1}. ${esc(f.file.name)}<small>${(f.file.size/1024/1024).toFixed(2)} MB</small></span><button type="button" data-remove-file="${i}" aria-label="移除 ${esc(f.file.name)}">✕</button></div>`).join('');$$('[data-remove-file]').forEach(b=>b.onclick=()=>{const [f]=files.splice(Number(b.dataset.removeFile),1);if(f.preview)URL.revokeObjectURL(f.preview);review=null;if($('#review-area'))$('#review-area').innerHTML='';renderFiles()})}
function lockFileControls(locked){$$('#multi-files,#camera-file,[data-remove-file]').forEach(n=>n.disabled=locked)}
async function encodeFile(f){if(f.encoded)return f.encoded;let blob=f.file;if(f.mime.startsWith('image/')){const image=await createImageBitmap(f.file);const ratio=Math.min(1,2000/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.88));if(!blob)throw Error('圖片處理失敗，請改用 JPG');f.uploadBlob=blob}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('無法讀取檔案'));reader.readAsDataURL(blob)});f.encoded={name:f.file.name,mime:blob.type||f.mime,data};return f.encoded}
async function encodeAll(){if(!files.length)throw Error('請先加入至少一個檔案');const encoded=[];for(const f of files)encoded.push(await encodeFile(f));if(encoded.reduce((n,f)=>n+f.data.length,0)>17000000)throw Error('這批檔案太大，請減少檔案或拆批上傳。');return encoded}

const actions={'new-folder':newFolder,'materials-upload':uploadMaterials,'style-upload':uploadStyle,'add-card':()=>cardModal(),'guide-account':()=>go('guide'),'clear-key':()=>{geminiKey='';keyChecked=false;models=[];render();toast('已清除當次分頁的 API Key')},export:exportData,reconnect:boot,'retry-sync':async()=>{syncError='';await commit()},'reload-cloud':()=>confirmAction('重新載入雲端資料？','尚未同步的修改會被雲端版本取代。若有同步錯誤，請先取消並匯出備份。',async()=>{await saveQueue;await loadCloud();closeModal();render();toast('已載入最新雲端資料')}),rename:()=>{if(!needUser())return;modal(`${dialogTop('重新命名資料夾')}<form id="rename-form"><div class="field"><label>資料夾名稱<input id="rename-value" required maxlength="70" value="${esc(folder().name)}"></label></div><button class="btn primary">儲存</button></form>`);$('#rename-form').onsubmit=async e=>{e.preventDefault();if(!$('#rename-value').value.trim())return;folder().name=$('#rename-value').value.trim();await commit();closeModal();render()}},'delete-folder':()=>confirmAction('刪除資料夾？',`將刪除「${folder().name}」及其中${folder().cards.length}張卡片。原始檔案與已產生考卷保留。`,async()=>{db.folders=db.folders.filter(f=>f.id!==folderId);await commit();closeModal();go('folders')}),print:()=>printPaper(false),'print-answers':()=>printPaper(true),'local-grade':()=>submitExam(false),logout:async()=>{await flushAnswers();if(syncError){toast('請先匯出或同步資料後再登出');return}try{await api('/api/auth/logout',{method:'POST'});window.google?.accounts?.id?.disableAutoSelect();geminiKey='';keyChecked=false;models=[];db=empty();revision=0;user=null;await boot();go('account')}catch(err){toast(err.message)}},'import-legacy':()=>{if(!needUser())return;confirmAction('匯入舊版自行建立的資料？','會排除舊版示範資料夾與示範樣式。原有雲端資料保留；請勿重複匯入。',async()=>{let data;try{data=JSON.parse(localStorage.getItem('studyform-v1'))}catch{}if(!data){closeModal();toast('此瀏覽器找不到舊版資料');return}closeModal();await mergeImport(data,true)})}};$$('[data-action]').forEach(b=>b.onclick=async()=>{try{await actions[b.dataset.action]?.()}catch(err){toast(err.message)}});
$('#gemini-key').oninput=e=>{geminiKey=e.target.value.trim();keyChecked=false};$('#gemini-model').onchange=e=>{model=e.target.value.trim()};$('#key-form').onsubmit=async e=>{e.preventDefault();if(!needUser())return;geminiKey=$('#gemini-key').value.trim();if(!geminiKey){status($('#key-result'),'請先輸入 API Key',true);return}const done=busy($('#test-key'),'連接 Gemini…');try{const r=await api('/api/models',{method:'POST',ai:true});if(!r.models.length)throw Error('此金鑰目前沒有可用的 Gemini 文字生成模型');models=r.models;if(!models.some(m=>m.id===model))model=models.find(m=>m.id==='gemini-3.8-flash')?.id||models.find(m=>/flash/.test(m.id))?.id||models[0].id;keyChecked=true;render();status($('#key-result'),`連線成功，已取得 ${models.length} 個可用模型。`)}catch(err){status($('#key-result'),err.message,true);done()}};
if($('#folder-search'))$('#folder-search').oninput=e=>{const result=db.folders.filter(f=>f.name.toLowerCase().includes(e.target.value.toLowerCase()));$('#folder-results').innerHTML=result.map(folderCard).join('')||'<div class="empty">沒有符合的資料夾</div>';$('#folder-results').querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folderId=b.dataset.folder;go('detail')})};
if($('#generate-form')){$('#generate-form').onsubmit=makeExam;const summary=()=>{const t=db.templates.find(t=>t.id===$('#template-select').value);$('#template-summary').innerHTML=t?t.sections.map(s=>`<div class="number-row help"><span>${esc(s.name)}</span><span>${s.count}題 × ${s.points}分</span></div>`).join('')+`<p class="help">${esc(t.summary||'')}</p>`:''};$('#template-select').onchange=summary;summary()}
if($('#answer-form')){$('#answer-form').oninput=e=>{if(e.target.hasAttribute('data-self-grade'))return;collectAnswers();answersDirty=true;setSync('作答尚未同步…');clearTimeout(answerTimer);answerTimer=setTimeout(()=>flushAnswers().catch(err=>toast(err.message)),650)};$('#answer-form').onchange=e=>{if(e.target.dataset.selfGrade!==undefined){const ex=exam(),i=Number(e.target.dataset.selfGrade),value=Number(e.target.value);if(!Number.isFinite(value)||value<0||value>ex.questions[i].points){toast('分數超出配分範圍');return}ex.grades[i].credit=value/ex.questions[i].points;ex.grades[i].feedback='你已對照解答自行調整本題分數。';recalc(ex);commit().then(()=>render())}};$('#answer-form').onsubmit=e=>{e.preventDefault();submitExam(true)}}
for(const kind of ['login','register'])if($('#'+kind+'-form'))$('#'+kind+'-form').onsubmit=async e=>{e.preventDefault();const form=e.target,node=form.querySelector('.status-line');if(backendMode!=='connected'){status(node,'請先啟動登入後台，或開啟部署完成的網址。',true);return}const data=Object.fromEntries(new FormData(form));if(kind==='register'&&data.password!==data.confirm){status(node,'兩次密碼不一致',true);return}const done=busy(e.submitter||form.querySelector('button[type="submit"]'),kind==='register'?'建立帳號…':'登入中…');try{await flushAnswers();if(syncError)throw Error('請先匯出或處理尚未同步的資料，再切換帳號。');const r=await api('/api/auth/'+kind,{method:'POST',body:data});await switchAccount(r);}catch(err){status(node,err.message,true);done()}};
if($('#import-backup'))$('#import-backup').onchange=async e=>{if(!needUser())return;try{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)throw Error('備份檔超過2MB');await mergeImport(JSON.parse(await f.text()))}catch(err){toast(err.message)}};
}
boot();
})();
